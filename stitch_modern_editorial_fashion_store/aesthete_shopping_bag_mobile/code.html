<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AESTHETE - Shopping Bag</title>

<style>
        /* Custom scrollbar for webkit to keep minimal aesthetic */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #e2e2e2;
            border-radius: 4px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-md antialiased h-screen flex flex-col relative overflow-hidden">
<!-- Contextual Header (Transactional Flow - Global Nav Suppressed) -->
<header class="flex-none px-md py-sm flex items-center justify-between border-b border-outline-variant/30 bg-surface/90 backdrop-blur-sm z-10 sticky top-0">
<button aria-label="Close Shopping Bag" class="p-xs -ml-xs text-on-surface hover:opacity-70 transition-opacity">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 300;">close</span>
</button>
<h1 class="font-label-sm text-label-sm uppercase tracking-widest text-on-surface">Your Bag (2)</h1>
<div class="w-8"></div> <!-- Spacer to balance flex-between -->
</header>
<!-- Scrollable Content Area -->
<main class="flex-1 overflow-y-auto px-md py-lg pb-32"> <!-- pb-32 to account for sticky footer -->
<!-- Cart Items List -->
<div class="flex flex-col gap-lg">
<!-- Item 1: Hoodie -->
<div class="flex gap-md group">
<!-- Thumbnail -->
<div class="w-24 h-32 flex-none bg-surface-container-low rounded-lg overflow-hidden relative border border-outline-variant/20">
<img alt="Oversized Hoodie" class="object-cover w-full h-full mix-blend-multiply" data-alt="A striking product photography shot of a minimalist, architectural oversized black hoodie. The garment is laid flat against a pristine, soft white backdrop. The lighting is high-key and diffused, highlighting the structural seams and heavy weight of the premium cotton fabric. The aesthetic is clean, high-fashion streetwear, fitting a modern, quiet luxury brand." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCVDztSsXEPJJ4ZgVnw-a7csSsps3DaywFxFr_7WArw3z18l2LDKVzWvgXgHUNttUJOqt1jhdHzpavlMyawiUxvFMUn_8AsFG1yKiycGCZ6U91ZyK8q3X8lzbkDXeDBR0PxcUlhsHUEsP03BY4CgIlVBOVl5muC2aHssL-N65poFPmGfWq6sr_tveybtlb4ZLjTTEsuRq03SKE9HU161-CDQr0l2Rl2ffgIKG9UWjNVxESNtIu7F4YNUXnD1c5HlzlOZGVfA16Wp4YM"/>
</div>
<!-- Details -->
<div class="flex flex-col flex-1 justify-between py-xs">
<div>
<div class="flex justify-between items-start gap-sm">
<h2 class="font-body-lg text-body-lg font-semibold leading-tight text-on-surface">Architectural Oversized Hoodie</h2>
<p class="font-body-md text-body-md whitespace-nowrap">$185</p>
</div>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Onyx Black / Size L</p>
</div>
<!-- Actions -->
<div class="flex justify-between items-end mt-sm">
<!-- Quantity Adjuster -->
<div class="flex items-center border border-outline-variant/50 rounded-full h-8">
<button aria-label="Decrease quantity" class="w-8 h-full flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[16px]">remove</span>
</button>
<span class="font-label-sm text-label-sm w-6 text-center">1</span>
<button aria-label="Increase quantity" class="w-8 h-full flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[16px]">add</span>
</button>
</div>
<button class="font-label-sm text-label-sm uppercase text-on-surface-variant underline underline-offset-4 decoration-outline-variant/50 hover:text-primary hover:decoration-primary transition-colors">
                            Remove
                        </button>
</div>
</div>
</div>
<!-- Technical Divider -->
<div class="w-full h-[1px] bg-outline-variant/30"></div>
<!-- Item 2: Boots -->
<div class="flex gap-md group">
<!-- Thumbnail -->
<div class="w-24 h-32 flex-none bg-surface-container-low rounded-lg overflow-hidden relative border border-outline-variant/20">
<img alt="Combat Boots" class="object-cover w-full h-full mix-blend-multiply" data-alt="A sharp, detailed product image of chunky, brutalist platform combat boots in matte black leather. The boots are angled slightly to show the aggressive tread pattern on the sole. They rest on a smooth, light gray surface with soft, natural shadows grounding them. The lighting emphasizes the texture of the leather and the metallic hardware. The vibe is modern, utilitarian, and high-end streetwear." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCVfwR4Oq4WH1fCtxUJKy10KXvJ5-GH5DgEUMVaBFt0GzzMCFRtUM5eLi7tb-wAhpPAKVPPwrLzwFZDEhDCsh6JcG4KyoL2yWMiXy3nhPWQBymDUgEx4iJcDkNTNzfJ7tNFBcZaawSU2y5wijFy0m55Wpl-3sU0viHC5dkGPBCXpCljSDysvW5ybqkrSjxXUQ81yTnoNprKLvB-UwLi5bOBU_eJoyjiok3IesowYBxrxsLOb3VfbehYpKXd7Nl4NgmpfebJN8CQVlgW"/>
</div>
<!-- Details -->
<div class="flex flex-col flex-1 justify-between py-xs">
<div>
<div class="flex justify-between items-start gap-sm">
<h2 class="font-body-lg text-body-lg font-semibold leading-tight text-on-surface">Brutalist Platform Boots</h2>
<p class="font-body-md text-body-md whitespace-nowrap">$420</p>
</div>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Matte Leather / Size 42</p>
</div>
<!-- Actions -->
<div class="flex justify-between items-end mt-sm">
<!-- Quantity Adjuster -->
<div class="flex items-center border border-outline-variant/50 rounded-full h-8">
<button aria-label="Decrease quantity" class="w-8 h-full flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[16px]">remove</span>
</button>
<span class="font-label-sm text-label-sm w-6 text-center">1</span>
<button aria-label="Increase quantity" class="w-8 h-full flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[16px]">add</span>
</button>
</div>
<button class="font-label-sm text-label-sm uppercase text-on-surface-variant underline underline-offset-4 decoration-outline-variant/50 hover:text-primary hover:decoration-primary transition-colors">
                            Remove
                        </button>
</div>
</div>
</div>
</div>
<!-- Order Summary Section -->
<div class="mt-xl pt-lg border-t border-outline-variant/30">
<h3 class="font-headline-md text-headline-md text-on-surface mb-md">Summary</h3>
<div class="flex flex-col gap-sm">
<div class="flex justify-between items-center text-on-surface-variant">
<span class="font-body-md text-body-md">Subtotal</span>
<span class="font-body-md text-body-md">$605.00</span>
</div>
<div class="flex justify-between items-center text-on-surface-variant">
<span class="font-body-md text-body-md">Shipping</span>
<span class="font-body-md text-body-md text-secondary tracking-wide text-sm">Complimentary</span>
</div>
<div class="flex justify-between items-center text-on-surface-variant">
<span class="font-body-md text-body-md">Taxes</span>
<span class="font-body-md text-body-md text-sm italic">Calculated at next step</span>
</div>
<div class="w-full h-[1px] bg-outline-variant/30 my-xs"></div>
<div class="flex justify-between items-center text-on-surface mt-xs">
<span class="font-body-lg text-body-lg font-semibold">Total</span>
<span class="font-headline-md text-headline-md tracking-tight">$605.00</span>
</div>
</div>
</div>
</main>
<!-- Sticky Footer Action -->
<footer class="absolute bottom-0 left-0 w-full px-md py-md pb-8 bg-surface/90 backdrop-blur-xl border-t border-outline-variant/20 shadow-[0_-10px_40px_rgba(0,0,0,0.05)] z-20">
<button class="w-full bg-primary text-on-primary font-label-sm text-label-sm uppercase tracking-widest py-4 rounded-none hover:bg-surface-tint transition-colors duration-300 flex items-center justify-center gap-sm">
            Proceed to Checkout
            <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</footer>
</body></html>
