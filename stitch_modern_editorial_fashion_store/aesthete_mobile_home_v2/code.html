</button>

<div class="absolute inset-0 border-2 border-transparent group-hover:border-secondary transition-colors duration-500 rounded-2xl pointer-events-none z-10"></div>

<div class="absolute inset-0 border-2 border-transparent group-hover:border-secondary transition-colors duration-500 rounded-2xl pointer-events-none z-10"></div>

<!-- Home (Active) -->

<button aria-label="search" class="flex flex-col items-center justify-center text-on-surface-variant/60 hover:text-primary dark:hover:text-primary-fixed transition-colors duration-300 group">

<script>
        // Subtle parallax effect on hero image for tactile feel
        window.addEventListener('scroll', () => {
            const scrollPos = window.scrollY;
            const heroBg = document.getElementById('hero-bg');
            if (heroBg && scrollPos < window.innerHeight) {
                heroBg.style.transform = `translateY(${scrollPos * 0.2}px) scale(1.05)`;
            }
        });
    </script>
