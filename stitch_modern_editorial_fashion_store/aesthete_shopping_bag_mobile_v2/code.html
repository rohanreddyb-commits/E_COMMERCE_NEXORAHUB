<style>

            width: 4px;

<body class="bg-surface text-on-surface antialiased overflow-hidden h-screen w-full flex flex-col font-body-md">
<!-- Top Navigation (Transactional/Focus - No Shell Nav) -->
<header class="flex justify-between items-center px-gutter w-full h-16 bg-surface/80 backdrop-blur-md z-50 fixed top-0 left-0">
<button aria-label="Close Cart" class="p-2 -ml-2 text-primary hover:opacity-70 transition-opacity">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<span class="font-display-lg text-headline-md tracking-tighter text-primary">CART (2)</span>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto pt-20 pb-40 px-gutter w-full max-w-lg mx-auto">
<!-- Cart Items List -->
<div class="flex flex-col gap-lg">
<!-- Item 1: Essential Hoodie -->
<article class="flex gap-md items-start group">
<!-- Thumbnail -->
<div class="w-24 h-32 bg-surface-container-low rounded-lg overflow-hidden shrink-0 relative">

</div>
<!-- Details -->
<div class="flex-1 flex flex-col justify-between h-32 py-xs">
<div>
<div class="flex justify-between items-start">
<h3 class="font-headline-md text-headline-md text-primary leading-tight">Essential Hoodie</h3>
<button aria-label="Remove item" class="text-on-surface-variant hover:text-error transition-colors">
<span class="material-symbols-outlined text-[20px]">delete_outline</span>
</button>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1 uppercase tracking-widest">Color: Onyx • Size: L</p>
</div>
<div class="flex justify-between items-end mt-auto">
<!-- Quantity Adjuster -->
<div class="flex items-center border border-outline-variant rounded-full px-2 py-1">
<button class="w-6 h-6 flex items-center justify-center text-primary hover:text-secondary-fixed transition-colors">
<span class="material-symbols-outlined text-[16px]">remove</span>
</button>
<span class="font-label-sm text-label-sm w-6 text-center">1</span>
<button class="w-6 h-6 flex items-center justify-center text-primary hover:text-secondary-fixed transition-colors">
<span class="material-symbols-outlined text-[16px]">add</span>
</button>
</div>
<!-- Price -->
<span class="font-headline-md text-headline-md text-primary">$185</span>
</div>
</div>
</article>
<!-- Divider -->
<div class="w-full h-[1px] bg-outline-variant/30"></div>
<!-- Item 2: Relaxed Trouser -->
<article class="flex gap-md items-start group">
<!-- Thumbnail -->
<div class="w-24 h-32 bg-surface-container-low rounded-lg overflow-hidden shrink-0 relative">
<img alt="Relaxed Trouser" class="w-full h-full object-cover mix-blend-multiply" data-alt="A high-end editorial shot of wide-leg, relaxed-fit trousers in a muted slate grey. The trousers are draped elegantly against a seamless light grey background, showcasing the fluid drape of the tailored fabric. The lighting is soft and directional, creating subtle shadows that enhance the depth and minimalist, architectural aesthetic of the design." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCJ2Y1eqNkKVEBcMmKV7KiKzkpkIRTF19JStZvh__6cYxhrxB9xAxYZlQLLnSd07-U_nzv-0RK-R6oCb1HPZQFZogbVzUmr2UHrtbiwyKg4_f54cxa2xhjzJ7dyzOSHC6NmCvvmpSpeFdW8tGB34DKTgRRgs69OUIfT2BbFqu-1E2xFuodFUyy79holA8bjLDn8iFM4QALN6rNCUenYAr34EftZRYPHeHT_8rww6GCtfl33CdclfL2nJJcbVGyQYgn4uAElDnkLX6Pg"/>
</div>
<!-- Details -->
<div class="flex-1 flex flex-col justify-between h-32 py-xs">
<div>
<div class="flex justify-between items-start">
<h3 class="font-headline-md text-headline-md text-primary leading-tight">Relaxed Trouser</h3>
<button aria-label="Remove item" class="text-on-surface-variant hover:text-error transition-colors">
<span class="material-symbols-outlined text-[20px]">delete_outline</span>
</button>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1 uppercase tracking-widest">Color: Slate • Size: 32</p>
</div>
<div class="flex justify-between items-end mt-auto">
<!-- Quantity Adjuster -->
<div class="flex items-center border border-outline-variant rounded-full px-2 py-1">
<button class="w-6 h-6 flex items-center justify-center text-primary hover:text-secondary-fixed transition-colors">
<span class="material-symbols-outlined text-[16px]">remove</span>
</button>
<span class="font-label-sm text-label-sm w-6 text-center">1</span>
<button class="w-6 h-6 flex items-center justify-center text-primary hover:text-secondary-fixed transition-colors">
<span class="material-symbols-outlined text-[16px]">add</span>
</button>
</div>
<!-- Price -->
<span class="font-headline-md text-headline-md text-primary">$240</span>
</div>
</div>
</article>
</div>
</main>
<!-- Sticky Order Summary Bottom Zone -->
<section class="fixed bottom-0 left-0 w-full glass-panel shadow-[0_-12px_40px_rgba(0,0,0,0.05)] border-t border-outline-variant/20 z-50 rounded-t-3xl pt-md pb-8 px-gutter max-w-lg left-1/2 -translate-x-1/2">
<!-- Promo Code Input -->
<div class="mb-md">
<div class="relative w-full">
<input class="w-full bg-transparent border-0 border-b border-outline-variant text-primary font-label-sm text-label-sm uppercase tracking-widest py-2 px-0 focus:ring-0 neo-focus placeholder:text-on-surface-variant/50 transition-colors" placeholder="Promo Code" type="text"/>
<button class="absolute right-0 top-1/2 -translate-y-1/2 font-label-sm text-label-sm text-primary uppercase tracking-widest hover:text-secondary-fixed transition-colors">Apply</button>
</div>
</div>
<!-- Summary Totals -->
<div class="flex flex-col gap-sm mb-lg">
<div class="flex justify-between items-center text-on-surface-variant">
<span class="font-body-md text-body-md">Subtotal</span>
<span class="font-body-md text-body-md">$425.00</span>
</div>
<div class="flex justify-between items-center text-on-surface-variant">
<span class="font-body-md text-body-md">Shipping</span>
<span class="font-label-sm text-label-sm uppercase tracking-widest text-primary">Calculated at next step</span>
</div>
</div>

<div class="flex items-center gap-md">
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest mb-1">Total</span>
<span class="font-display-lg text-headline-lg-mobile text-primary leading-none">$425</span>
</div>
<button class="flex-1 bg-primary text-on-primary font-label-sm text-label-sm uppercase tracking-widest py-4 rounded-full hover:bg-secondary hover:text-on-secondary transition-all active:scale-95 shadow-lg flex items-center justify-center gap-2">
                PROCEED TO CHECKOUT
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
<!-- Safe area padding for newer iPhones -->
<div class="h-safe"></div>
</section>
